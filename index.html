<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F&M Club 伴走プロジェクト ダッシュボード</title>
    
    <!-- Scripts: React, Babel, Tailwind, Lucide -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase Compat SDK (Using Compat mode for stable global scope access) -->
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Firebase Configuration ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const apiKey = ""; // Gemini API key provided by environment

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- Defaults ---
        const DEFAULT_CONFIG = {
            companyName: "F&M Club 伴走プロジェクト",
            vision: "地域No.1の技術力で、顧客から選ばれ続ける100年企業になる",
            slogan: "組織の壁を越え、全社一丸で生産性向上！",
            logo: "📊"
        };

        // --- Icon Component (Safe from direct DOM mutation conflicts) ---
        const Icon = ({ name, size = 18, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current && window.lucide) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.style.width = `${size}px`;
                    i.style.height = `${size}px`;
                    ref.current.appendChild(i);
                    window.lucide.createIcons();
                }
                return () => { if (ref.current) ref.current.innerHTML = ''; };
            }, [name, size]);
            return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size }}></span>;
        };

        // --- Gemini API Helper ---
        const callGemini = async (prompt, systemInstruction = "") => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined,
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error("AI API request failed");
            const result = await response.json();
            return result.candidates?.[0]?.content?.parts?.[0]?.text || "回答を取得できませんでした。";
        };

        // --- UI Modal ---
        const Modal = ({ isOpen, onClose, title, children, size = "max-w-md" }) => {
            const modalRef = useRef();
            if (!isOpen) return null;
            const handleOverlayClick = (e) => { if (modalRef.current === e.target) onClose(); };
            return (
                <div ref={modalRef} onClick={handleOverlayClick} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm overflow-y-auto">
                    <div className={`bg-white rounded-xl shadow-2xl w-full ${size} overflow-hidden animate-in fade-in zoom-in duration-200 my-8`}>
                        <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                            <h3 className="font-bold text-gray-800">{title}</h3>
                            <button onClick={onClose} className="p-2 hover:bg-gray-200 rounded-full transition-colors text-gray-500 hover:text-gray-800">
                                <Icon name="x" size={20} />
                            </button>
                        </div>
                        <div className="p-6">{children}</div>
                    </div>
                </div>
            );
        };

        const Card = ({ title, iconName, children, actions, className = "" }) => (
            <div className={`glass border border-slate-200 rounded-xl shadow-sm overflow-hidden flex flex-col ${className}`}>
                <div className="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-white/50">
                    <div className="flex items-center gap-2 font-bold text-slate-800">
                        {iconName && <Icon name={iconName} className="text-blue-500" />}
                        {title}
                    </div>
                    <div className="flex items-center gap-2">{actions}</div>
                </div>
                <div className="p-5 flex-1">{children}</div>
            </div>
        );

        const ProgressBar = ({ percent }) => {
            const colorClass = useMemo(() => {
                if (percent >= 100) return 'bg-green-500';
                if (percent >= 60) return 'bg-yellow-500';
                return 'bg-red-500';
            }, [percent]);
            return (
                <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                    <div className={`h-full transition-all duration-1000 ease-out ${colorClass}`} style={{ width: `${Math.min(100, percent)}%` }} />
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [config, setConfig] = useState(DEFAULT_CONFIG);
            const [kpis, setKpis] = useState([]);
            const [challenges, setChallenges] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [meetings, setMeetings] = useState([]);
            const [error, setError] = useState(null);
            const [aiLoading, setAiLoading] = useState(false);
            const [aiResponse, setAiResponse] = useState("");
            const [isFullscreen, setIsFullscreen] = useState(false);
            
            const [activeModal, setActiveModal] = useState(null); 
            const [editItem, setEditItem] = useState(null);
            const [deleteTarget, setDeleteTarget] = useState(null);

            // Authentication Initialization (Mandatory Order)
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (err) {
                        console.error("Authentication failed:", err);
                        setError("認証に失敗しました。ページを再読み込みしてください。");
                    }
                };
                initAuth();
                const unsubscribeAuth = auth.onAuthStateChanged(setUser);
                
                const handleFs = () => setIsFullscreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', handleFs);

                return () => {
                    unsubscribeAuth();
                    document.removeEventListener('fullscreenchange', handleFs);
                };
            }, []);

            // Firestore Data Listeners (Guarded by user state)
            useEffect(() => {
                if (!user) return;

                // Rule 1: artifacts/{appId}/public/data/{collectionName}
                const configRef = db.doc(`artifacts/${appId}/public/data/config/settings`);
                const unsubConfig = configRef.onSnapshot((snap) => {
                    if (snap.exists) setConfig(snap.data());
                    else configRef.set(DEFAULT_CONFIG).catch(e => console.error("Initial config write error:", e));
                }, (err) => console.error("Config listener error:", err));

                const setupCollection = (colName, setState) => {
                    return db.collection(`artifacts/${appId}/public/data/${colName}`).onSnapshot((snap) => {
                        setState(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    }, (err) => console.error(`${colName} listener error:`, err));
                };

                const unsubs = [
                    unsubConfig,
                    setupCollection('kpis', setKpis),
                    setupCollection('challenges', setChallenges),
                    setupCollection('tasks', setTasks),
                    setupCollection('meetings', setMeetings)
                ];

                return () => unsubs.forEach(u => u());
            }, [user]);

            const crud = {
                saveConfig: async (e) => {
                    e.preventDefault();
                    if (!user) return;
                    const formData = Object.fromEntries(new FormData(e.target));
                    await db.doc(`artifacts/${appId}/public/data/config/settings`).set(formData);
                    setActiveModal(null);
                },
                handleKpi: async (e) => {
                    e.preventDefault();
                    if (!user) return;
                    const f = new FormData(e.target);
                    const cur = parseFloat(f.get('current')) || 0, tar = parseFloat(f.get('target')) || 1;
                    const data = { name: f.get('name'), current: cur, target: tar, percent: Math.round((cur/tar)*100), unit: f.get('unit') };
                    if (editItem) await db.doc(`artifacts/${appId}/public/data/kpis/${editItem.id}`).update(data);
                    else await db.collection(`artifacts/${appId}/public/data/kpis`).add(data);
                    setActiveModal(null); setEditItem(null);
                },
                handleChallenge: async (e) => {
                    e.preventDefault();
                    if (!user) return;
                    const f = new FormData(e.target);
                    const data = { title: f.get('title'), strategy: f.get('strategy') };
                    if (editItem) await db.doc(`artifacts/${appId}/public/data/challenges/${editItem.id}`).update(data);
                    else await db.collection(`artifacts/${appId}/public/data/challenges`).add(data);
                    setActiveModal(null); setEditItem(null);
                },
                handleTask: async (e) => {
                    e.preventDefault();
                    if (!user) return;
                    const f = new FormData(e.target);
                    const data = { title: f.get('title'), owner: f.get('owner'), deadline: f.get('deadline'), status: editItem?.status || 'todo' };
                    if (editItem) await db.doc(`artifacts/${appId}/public/data/tasks/${editItem.id}`).update(data);
                    else await db.collection(`artifacts/${appId}/public/data/tasks`).add(data);
                    setActiveModal(null); setEditItem(null);
                },
                handleMeeting: async (e) => {
                    e.preventDefault();
                    if (!user) return;
                    const f = new FormData(e.target);
                    const data = { date: f.get('date'), agenda: f.get('agenda'), decisions: f.get('decisions') };
                    if (editItem) await db.doc(`artifacts/${appId}/public/data/meetings/${editItem.id}`).update(data);
                    else await db.collection(`artifacts/${appId}/public/data/meetings`).add(data);
                    setActiveModal(null); setEditItem(null);
                }
            };

            const requestDelete = (col, id) => {
                setDeleteTarget({ col, id });
                setActiveModal('delete_confirm');
            };

            const executeDelete = async () => {
                if (!deleteTarget || !user) return;
                await db.doc(`artifacts/${appId}/public/data/${deleteTarget.col}/${deleteTarget.id}`).delete();
                setActiveModal(null); setDeleteTarget(null);
            };

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                else document.exitFullscreen();
            };

            const ai = {
                diagnosis: async () => {
                    setAiLoading(true); setActiveModal('ai_response'); setAiResponse("経営診断データを分析中...");
                    const prompt = `診断依頼: 会社名:${config.companyName}, ビジョン:${config.vision}, KPI:${kpis.map(k=>k.name+k.percent+'%').join(',')}`;
                    try { setAiResponse(await callGemini(prompt, "プロフェッショナル経営コンサルタントとして強み・懸念点・具体的アドバイスを日本語Markdownで構成してください。")); } 
                    catch(e) { setAiResponse("AI診断中にエラーが発生しました。"); } finally { setAiLoading(false); }
                },
                suggest: async (c) => {
                    setAiLoading(true); setActiveModal('ai_response'); setAiResponse("アクション案を立案中...");
                    const prompt = `課題「${c.title}」の解決タスク5つ。JSON {"actions": ["T1", "T2", ...]} のみ出力してください。`;
                    try {
                        const res = await callGemini(prompt, "JSON形式のみ出力。");
                        const parsed = JSON.parse(res.replace(/```json|```/g, "").trim());
                        setAiResponse(`### ${c.title} への推奨アクション\n\n` + parsed.actions.map(a => `- ${a}`).join('\n'));
                        setEditItem({ type: 'bulk_tasks', data: parsed.actions });
                    } catch(e) { setAiResponse("AI提案エラー。"); } finally { setAiLoading(false); }
                },
                summarize: async () => {
                    const agenda = document.getElementById('new_agenda')?.value;
                    if (!agenda) return;
                    setAiLoading(true);
                    try { 
                        const res = await callGemini(`要約してNext Actionを作成: ${agenda}`, "箇条書きで決定事項とタスクを整理。");
                        const decisionsEl = document.getElementById('new_decisions');
                        if (decisionsEl) decisionsEl.value = res;
                    } finally { setAiLoading(false); }
                }
            };

            if (error) return <div className="h-screen flex items-center justify-center p-6 bg-slate-50 text-center"><Card title="エラー"><p className="text-red-600 font-bold mb-4">{error}</p><button onClick={()=>window.location.reload()} className="px-4 py-2 bg-blue-600 text-white rounded-lg">再読み込み</button></Card></div>;
            if (!user) return <div className="h-screen flex items-center justify-center bg-slate-50"><Icon name="loader-2" className="animate-spin text-blue-500" size={32} /></div>;

            return (
                <div className={`min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 text-slate-900 p-4 md:p-8 ${isFullscreen ? 'overflow-y-auto' : ''}`}>
                    <div className="max-w-7xl mx-auto space-y-8">
                        {/* Header */}
                        <header className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 pb-6 border-b border-slate-200">
                            <div className="flex items-center gap-4">
                                <div className="w-16 h-16 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center text-3xl shadow-lg">{config.logo}</div>
                                <div>
                                    <div className="flex items-center gap-3">
                                        <h1 className="text-3xl font-black text-slate-800 tracking-tight">{config.companyName}</h1>
                                        <button onClick={() => setActiveModal('config')} className="p-1.5 text-slate-400 hover:text-blue-500 transition-colors" title="設定を編集"><Icon name="edit-2" size={16}/></button>
                                    </div>
                                    <div className="flex items-center gap-3 mt-1">
                                        <p className="text-slate-500 font-medium">伴走プロジェクト・ダッシュボード</p>
                                        <button onClick={ai.diagnosis} className="flex items-center gap-1 px-3 py-1 bg-gradient-to-r from-amber-400 to-orange-500 text-white text-[10px] font-bold rounded-full animate-pulse"><Icon name="sparkles" size={12}/> AI 経営診断</button>
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <button onClick={toggleFullscreen} className="px-4 py-2 bg-white border border-slate-200 rounded-xl font-bold text-sm flex items-center gap-2 hover:border-blue-300 transition-colors shadow-sm">
                                    <Icon name={isFullscreen ? "minimize" : "maximize"} size={16}/> {isFullscreen ? "縮小" : "全画面"}
                                </button>
                                <a href="https://member.fmclub.jp/" target="_blank" className="flex items-center gap-2 px-5 py-2.5 bg-white border border-slate-200 rounded-xl font-bold text-sm hover:shadow-md transition-all group">F&M Club <Icon name="external-link" size={14} className="group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform" /></a>
                            </div>
                        </header>

                        {/* Vision / Slogan */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-white p-6 rounded-2xl border-l-4 border-blue-500 shadow-sm relative group">
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Vision / 3年後の姿</span>
                                <p className="text-lg font-bold text-slate-800 mt-1 leading-relaxed">{config.vision}</p>
                            </div>
                            <div className="bg-white p-6 rounded-2xl border-l-4 border-indigo-500 shadow-sm relative group">
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Slogan / 今期のスローガン</span>
                                <p className="text-lg font-bold text-slate-800 mt-1 leading-relaxed">{config.slogan}</p>
                            </div>
                        </div>

                        {/* Main Panels */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <Card title="KPI 進捗" iconName="trending-up" actions={<button onClick={()=>{setEditItem(null); setActiveModal('kpi');}} className="p-1.5 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition-colors"><Icon name="plus" size={18}/></button>}>
                                <div className="space-y-6">
                                    {kpis.length === 0 && <p className="text-center text-slate-400 py-8 italic text-sm">記録なし</p>}
                                    {kpis.map(k => (
                                        <div key={k.id} className="group">
                                            <div className="flex justify-between items-end mb-2">
                                                <div><h4 className="font-bold flex items-center gap-2 text-slate-800">{k.name} <button onClick={()=>{setEditItem(k); setActiveModal('kpi');}} className="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-blue-500 transition-all"><Icon name="edit-2" size={12}/></button></h4><span className="text-xs text-slate-400">目標: {k.target}{k.unit}</span></div>
                                                <div className="text-right"><span className={`text-sm font-bold ${k.percent>=100?'text-green-600':'text-blue-600'}`}>{k.percent}%</span><div className="text-xs text-slate-600 font-bold">{k.current} / {k.target}</div></div>
                                            </div>
                                            <ProgressBar percent={k.percent} />
                                            <button onClick={()=> requestDelete('kpis', k.id)} className="text-[10px] text-slate-300 opacity-0 group-hover:opacity-100 mt-1 block ml-auto hover:text-red-500">削除</button>
                                        </div>
                                    ))}
                                </div>
                            </Card>

                            <Card title="主要課題と経営方針" iconName="target" actions={<button onClick={()=>{setEditItem(null); setActiveModal('challenge');}} className="p-1.5 bg-indigo-50 text-indigo-600 rounded-lg hover:bg-indigo-100 transition-colors"><Icon name="plus" size={18}/></button>}>
                                <div className="space-y-4">
                                    {challenges.length === 0 && <p className="text-center text-slate-400 py-8 italic text-sm">課題なし</p>}
                                    {challenges.map((c, i) => (
                                        <div key={c.id} className="p-4 bg-slate-50 border border-slate-100 rounded-xl group relative hover:border-indigo-200 transition-all">
                                            <div className="flex justify-between items-start mb-1">
                                                <h4 className="font-bold flex items-center gap-2 text-slate-800"><span className="w-5 h-5 bg-indigo-500 text-white text-[10px] flex items-center justify-center rounded-full font-bold">{i+1}</span>{c.title}</h4>
                                                <div className="flex gap-3 opacity-0 group-hover:opacity-100 transition-all">
                                                    <button onClick={()=>ai.suggest(c)} className="text-amber-500 hover:text-amber-600 text-[10px] font-bold flex items-center gap-1"><Icon name="sparkles" size={12}/> AI提案</button>
                                                    <button onClick={()=>{setEditItem(c); setActiveModal('challenge');}} className="text-slate-400 hover:text-blue-500"><Icon name="edit-2" size={14}/></button>
                                                    <button onClick={()=> requestDelete('challenges', c.id)} className="text-slate-400 hover:text-red-500"><Icon name="trash-2" size={14}/></button>
                                                </div>
                                            </div>
                                            <p className="text-sm text-slate-600 ml-7 italic leading-relaxed"><span className="text-indigo-500 font-bold not-italic">方針:</span> {c.strategy}</p>
                                        </div>
                                    ))}
                                </div>
                            </Card>
                        </div>

                        {/* Kanban Section */}
                        <section className="space-y-4">
                            <h2 className="text-xl font-bold flex items-center gap-2 text-slate-800"><Icon name="trello" className="text-blue-500"/> アクションプラン</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {['todo', 'doing', 'done'].map(status => (
                                    <div key={status} className="bg-slate-100/50 p-4 rounded-2xl border border-slate-200 min-h-[400px] flex flex-col gap-4">
                                        <div className="flex items-center justify-between border-b pb-2 border-slate-200">
                                            <span className="font-bold text-slate-700">{status==='todo'?'未着手':status==='doing'?'進行中':'完了実績'}</span>
                                            <span className="bg-white border text-xs px-2 rounded-full font-bold text-slate-400">{tasks.filter(t=>t.status===status).length}</span>
                                        </div>
                                        <div className="space-y-3 flex-1 overflow-y-auto">
                                            {tasks.filter(t=>t.status===status).map(task => (
                                                status === 'done' ? (
                                                    <div key={task.id} className="bg-white/60 p-3 rounded-lg border border-slate-200 flex items-center justify-between gap-3 text-sm group hover:bg-white transition-all shadow-sm">
                                                        <div className="flex items-center gap-3 flex-1 min-w-0 line-through text-slate-400">
                                                            <span className="text-[10px] font-bold bg-slate-50 px-2 rounded whitespace-nowrap border border-slate-100">{task.deadline||'完了'}</span>
                                                            <span className="truncate flex-1">{task.title}</span>
                                                        </div>
                                                        <div className="flex gap-1 shrink-0">
                                                            <button onClick={()=>db.doc(`artifacts/${appId}/public/data/tasks/${task.id}`).update({status:'doing'})} className="text-slate-300 hover:text-blue-500 transition-colors" title="戻す"><Icon name="chevron-left" size={14}/></button>
                                                            <button onClick={()=>requestDelete('tasks', task.id)} className="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500"><Icon name="trash-2" size={14}/></button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div key={task.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm group hover:border-blue-300 transition-all">
                                                        <div className="flex justify-between items-start mb-2">
                                                            <h5 className="font-bold text-sm text-slate-800 leading-snug">{task.title}</h5>
                                                            <button onClick={()=>requestDelete('tasks', task.id)} className="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500 transition-all"><Icon name="trash-2" size={14}/></button>
                                                        </div>
                                                        <div className="flex justify-between items-end text-[10px] text-slate-400 font-medium">
                                                            <div>担当: {task.owner}<br/>期限: {task.deadline}</div>
                                                            <div className="flex gap-1">
                                                                {status==='doing' && <button onClick={()=>db.doc(`artifacts/${appId}/public/data/tasks/${task.id}`).update({status:'todo'})} className="p-1 hover:text-blue-500 transition-colors"><Icon name="chevron-left" size={14}/></button>}
                                                                <button onClick={()=>db.doc(`artifacts/${appId}/public/data/tasks/${task.id}`).update({status:status==='todo'?'doing':'done'})} className="p-1 text-blue-500 hover:text-blue-700 transition-colors"><Icon name="chevron-right" size={14}/></button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                )
                                            ))}
                                        </div>
                                        {status === 'todo' && <button onClick={()=>{setEditItem(null); setActiveModal('task');}} className="w-full py-2 border-2 border-dashed border-slate-200 rounded-xl text-slate-400 text-xs font-bold hover:bg-white hover:border-blue-200 transition-all">+ 新規タスク追加</button>}
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* Meetings Log */}
                        <Card title="定例面談ログ" iconName="calendar" actions={<button onClick={()=>{setEditItem(null);setActiveModal('meeting');}} className="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold hover:bg-blue-100 transition-colors">+ 追加</button>}>
                            <div className="overflow-x-auto -mx-5">
                                <table className="w-full text-left">
                                    <thead><tr className="bg-slate-50 border-y border-slate-100 text-[10px] text-slate-400 font-bold uppercase tracking-widest"><th className="px-6 py-3 w-28">実施日</th><th className="px-6 py-3">アジェンダ</th><th className="px-6 py-3">決定事項 & 次のアクション</th><th className="px-6 py-3 text-center w-20">操作</th></tr></thead>
                                    <tbody className="divide-y border-slate-100 text-sm">
                                        {meetings.length === 0 && <tr><td colSpan="4" className="text-center py-10 text-slate-400 italic">面談記録はありません</td></tr>}
                                        {meetings.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(m=>(
                                            <tr key={m.id} className="hover:bg-blue-50/30 transition-all">
                                                <td className="px-6 py-4 font-bold text-blue-600 whitespace-nowrap">{m.date}</td>
                                                <td className="px-6 py-4 text-slate-700 whitespace-pre-wrap leading-relaxed">{m.agenda}</td>
                                                <td className="px-6 py-4 text-slate-800 font-medium whitespace-pre-wrap leading-relaxed">{m.decisions}</td>
                                                <td className="px-6 py-4 text-center">
                                                    <div className="flex gap-2 justify-center">
                                                        <button onClick={()=>{setEditItem(m);setActiveModal('meeting');}} className="text-slate-300 hover:text-blue-500 transition-colors" title="編集"><Icon name="edit-2" size={14}/></button>
                                                        <button onClick={()=>requestDelete('meetings', m.id)} className="text-slate-300 hover:text-red-500 transition-colors" title="削除"><Icon name="trash-2" size={14}/></button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </Card>

                        <footer className="text-center text-slate-400 text-[10px] uppercase tracking-[0.2em] pt-8 pb-12 border-t border-slate-200">© 2025 F&M Club Support Dashboard</footer>
                    </div>

                    {/* Modals */}
                    <Modal isOpen={activeModal==='delete_confirm'} onClose={()=>setActiveModal(null)} title="削除の確認">
                        <div className="space-y-6">
                            <p className="text-slate-600 text-sm">この項目を完全に削除します。取り消しはできません。よろしいですか？</p>
                            <div className="flex gap-3">
                                <button type="button" onClick={()=>setActiveModal(null)} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold hover:bg-slate-200 transition-colors">キャンセル</button>
                                <button type="button" onClick={executeDelete} className="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 transition-colors shadow-lg shadow-red-100">削除する</button>
                            </div>
                        </div>
                    </Modal>

                    <Modal isOpen={activeModal==='ai_response'} onClose={()=>setActiveModal(null)} title="✨ AI 経営サポート" size="max-w-2xl">
                        <div className="space-y-4">
                            <div className={`prose prose-sm max-w-none text-slate-700 leading-relaxed whitespace-pre-wrap ${aiLoading?'opacity-50':''}`}>
                                {aiResponse.split('\n').map((line, i) => (
                                    <p key={i} className={line.startsWith('#') ? 'font-bold text-slate-900 text-lg mt-4 border-b border-slate-100 pb-1' : line.startsWith('-') ? 'ml-4' : ''}>{line}</p>
                                ))}
                            </div>
                            {aiLoading && <div className="flex justify-center py-4"><Icon name="loader-2" className="animate-spin text-blue-500" size={24}/></div>}
                            {!aiLoading && editItem?.type==='bulk_tasks' && (
                                <div className="flex gap-3 pt-4">
                                    <button onClick={()=>setActiveModal(null)} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold">却下</button>
                                    <button onClick={async ()=>{
                                        for(const t of editItem.data) await db.collection(`artifacts/${appId}/public/data/tasks`).add({title:t, owner:"AI提案", deadline:"近日", status:"todo"});
                                        setActiveModal(null); setEditItem(null);
                                    }} className="flex-[2] py-3 bg-blue-600 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-blue-700 shadow-md">
                                        <Icon name="plus" size={18}/> これらをボードに追加
                                    </button>
                                </div>
                            )}
                            {!aiLoading && !editItem && <button onClick={()=>setActiveModal(null)} className="w-full py-3 bg-slate-100 rounded-xl font-bold hover:bg-slate-200 transition-colors mt-4">閉じる</button>}
                        </div>
                    </Modal>

                    {/* Form Modals */}
                    <Modal isOpen={activeModal==='config'} onClose={()=>setActiveModal(null)} title="全体設定の編集">
                        <form onSubmit={crud.saveConfig} className="space-y-4">
                            <div><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">プロジェクト名</label><input name="companyName" defaultValue={config.companyName} className="w-full p-2 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" /></div>
                            <div><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">ロゴ (絵文字)</label><input name="logo" defaultValue={config.logo} className="w-full p-2 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-xl" maxLength="2" /></div>
                            <div><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">ビジョン</label><textarea name="vision" defaultValue={config.vision} className="w-full p-2 border border-slate-200 rounded-xl h-24 outline-none focus:ring-2 focus:ring-blue-500 text-sm font-medium" /></div>
                            <div><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">スローガン</label><textarea name="slogan" defaultValue={config.slogan} className="w-full p-2 border border-slate-200 rounded-xl h-24 outline-none focus:ring-2 focus:ring-blue-500 text-sm font-medium" /></div>
                            <div className="flex gap-3 pt-2">
                                <button type="button" onClick={()=>setActiveModal(null)} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold">キャンセル</button>
                                <button type="submit" className="flex-[2] py-3 bg-blue-600 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-blue-700 shadow-md"><Icon name="save" size={18}/> 保存する</button>
                            </div>
                        </form>
                    </Modal>

                    <Modal isOpen={activeModal==='kpi'} onClose={()=>setActiveModal(null)} title={editItem?"KPIの編集":"新規KPI追加"}>
                        <form onSubmit={crud.handleKpi} className="space-y-4">
                            <div><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">項目名</label><input name="name" defaultValue={editItem?.name} required className="w-full p-2 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="売上、生産性など" /></div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">現在値</label><input name="current" type="number" step="any" defaultValue={editItem?.current} required className="w-full p-2 border border-slate-200 rounded-xl outline-none" /></div>
                                <div><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">目標値</label><input name="target" type="number" step="any" defaultValue={editItem?.target} required className="w-full p-2 border border-slate-200 rounded-xl outline-none" /></div>
                            </div>
                            <div><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">単位</label><input name="unit" defaultValue={editItem?.unit} className="w-full p-2 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="円、％、件など" /></div>
                            <div className="flex gap-3 pt-2">
                                <button type="button" onClick={()=>{setActiveModal(null);setEditItem(null);}} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold">キャンセル</button>
                                <button type="submit" className="flex-[2] py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-md">{editItem?"更新":"追加"}</button>
                            </div>
                        </form>
                    </Modal>

                    <Modal isOpen={activeModal==='challenge'} onClose={()=>setActiveModal(null)} title={editItem?"課題の編集":"新規課題追加"}>
                        <form onSubmit={crud.handleChallenge} className="space-y-4">
                            <div><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">課題タイトル</label><input name="title" defaultValue={editItem?.title} required className="w-full p-2 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" /></div>
                            <div><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">戦略方針</label><textarea name="strategy" defaultValue={editItem?.strategy} required className="w-full p-2 border border-slate-200 rounded-xl h-24 outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="どのように解決するか..." /></div>
                            <div className="flex gap-3 pt-2">
                                <button type="button" onClick={()=>{setActiveModal(null);setEditItem(null);}} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold">キャンセル</button>
                                <button type="submit" className="flex-[2] py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 shadow-md">保存する</button>
                            </div>
                        </form>
                    </Modal>

                    <Modal isOpen={activeModal==='task'} onClose={()=>setActiveModal(null)} title="アクション詳細">
                        <form onSubmit={crud.handleTask} className="space-y-4">
                            <div><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">タスク内容</label><input name="title" defaultValue={editItem?.title} required className="w-full p-2 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" /></div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">担当者</label><input name="owner" defaultValue={editItem?.owner} className="w-full p-2 border border-slate-200 rounded-xl outline-none" /></div>
                                <div><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">期限</label><input name="deadline" defaultValue={editItem?.deadline} className="w-full p-2 border border-slate-200 rounded-xl outline-none" placeholder="10/末 など" /></div>
                            </div>
                            <div className="flex gap-3 pt-2">
                                <button type="button" onClick={()=>{setActiveModal(null);setEditItem(null);}} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold">キャンセル</button>
                                <button type="submit" className="flex-[2] py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-md">保存</button>
                            </div>
                        </form>
                    </Modal>

                    <Modal isOpen={activeModal==='meeting'} onClose={()=>setActiveModal(null)} title="定例面談記録">
                        <form onSubmit={crud.handleMeeting} className="space-y-4">
                            <div><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">実施日</label><input name="date" type="date" defaultValue={editItem?.date || new Date().toISOString().split('T')[0]} required className="w-full p-2 border border-slate-200 rounded-xl outline-none" /></div>
                            <div>
                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">アジェンダ (相談内容)</label>
                                <textarea id="new_agenda" name="agenda" defaultValue={editItem?.agenda} required className="w-full p-2 border border-slate-200 rounded-xl h-24 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                                <button type="button" onClick={ai.summarize} disabled={aiLoading} className="mt-2 text-xs text-amber-600 font-bold flex items-center gap-1 hover:text-amber-700 transition-colors shadow-sm bg-white p-1 rounded border border-amber-100"><Icon name="sparkles" size={12}/> AIで要約と決定事項を案出</button>
                            </div>
                            <div><label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">決定事項 & Next Action</label><textarea id="new_decisions" name="decisions" defaultValue={editItem?.decisions} required className="w-full p-2 border border-slate-200 rounded-xl h-32 text-sm font-medium outline-none focus:ring-2 focus:ring-blue-500" /></div>
                            <div className="flex gap-3 pt-2">
                                <button type="button" onClick={()=>{setActiveModal(null);setEditItem(null);}} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold">キャンセル</button>
                                <button type="submit" className="flex-[2] py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-md">記録を保存</button>
                            </div>
                        </form>
                    </Modal>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
